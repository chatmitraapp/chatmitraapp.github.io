<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2457D6">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mitra Messenger</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#171b2d;--muted:#858b9b;--accent:#6657e8;--line:#eceef4;--danger:#d93045}
body.dark{--bg:#111522;--card:#1c2333;--text:#fff;--muted:#a0a7b8;--line:#30384a}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
header{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:800;color:var(--accent)}
.logo span{color:var(--text)}
.actions button{border:0;background:var(--card);color:var(--text);padding:10px;border-radius:12px;font-size:18px;margin-left:4px}
.search{padding:10px 16px}
.search input{width:100%;padding:15px;border:0;border-radius:14px;background:var(--card);color:var(--text);font-size:15px;outline:none}
.tabs{display:flex;gap:22px;padding:14px 18px;color:var(--muted);font-size:14px}
.tabs .active{color:var(--accent);font-weight:bold}
.section{padding:8px 18px;font-weight:bold}
.chat{display:flex;align-items:center;padding:13px 18px;gap:13px;background:var(--card);border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.avatar{width:49px;height:49px;flex-shrink:0;border-radius:50%;background:#e9e5ff;color:#6657e8;display:grid;place-items:center;font-size:21px;font-weight:bold}
.details{flex:1;min-width:0}
.name{font-weight:bold;margin-bottom:6px}
.message{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .presence{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}
.time{font-size:11px;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--card);padding:13px 5px;border-top:1px solid var(--line);z-index:3}
.bottom div{text-align:center;color:var(--muted);font-size:12px}
.bottom b{display:block;font-size:21px;margin-bottom:5px}
.bottom .selected{color:var(--accent)}
.newchat{position:fixed;right:20px;bottom:85px;background:var(--accent);color:white;border:0;border-radius:17px;padding:15px 19px;font-size:22px}
#chatScreen{display:none;padding-bottom:75px}
.chatHeader{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);position:sticky;top:0;z-index:2}
.chatHeader button{border:0;background:transparent;color:var(--text);font-size:22px}
#messages{padding:15px 12px 20px;min-height:55vh}
.bubble{max-width:84%;padding:11px 14px;margin:8px 0;border-radius:15px;background:var(--card);overflow-wrap:anywhere}
.messageRow{display:flex;align-items:center;gap:7px;margin:7px 0}
.messageRow.mine{justify-content:flex-end}
.messageRow.theirs{justify-content:flex-start}
.messageRow .bubble{margin:0;max-width:calc(84% - 34px)}
.quickReact{flex:0 0 30px;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--muted);font-size:17px;display:grid;place-items:center;cursor:pointer}
.quickReact:active{transform:scale(.94)}
.bubble.mine{margin-left:auto;background:var(--accent);color:white}
.bubble small{display:block;font-size:10px;opacity:.75;margin-top:5px}
.dateSeparator{
  width:fit-content;
  margin:16px auto;
  padding:6px 12px;
  border-radius:10px;
  background:var(--card);
  color:var(--muted);
  font-size:11px;
  box-shadow:0 1px 3px #0001;
}
.messageTicks{font-weight:bold;letter-spacing:-2px;margin-left:3px;white-space:nowrap}
.messageTicks.sent{color:#aeb4c0}
.messageTicks.delivered{color:#aeb4c0}
.messageTicks.seen{color:#55b7ff}

.bubble.deleted{font-style:italic;opacity:.7}
.reactionLine{font-size:17px;margin-top:5px;cursor:pointer;display:inline-flex;gap:5px;flex-wrap:wrap}.reactionPill{border:1px solid var(--line);border-radius:16px;padding:3px 8px;background:var(--card);font-size:14px;cursor:pointer}
.composer{position:fixed;bottom:0;left:0;right:0;padding:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--card);z-index:3}
.replyPreview{flex:0 0 100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-left:4px solid var(--accent);border-radius:9px;background:var(--bg);min-width:0}
.replyPreviewText{display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;font-size:12px}
.replyPreviewText b{color:var(--accent)}
.replyPreviewText span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.replyCancel{border:0;background:transparent;color:var(--text);font-size:23px;padding:0 5px}
.replyQuote{border-left:3px solid currentColor;background:#00000012;border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:12px;opacity:.9}
.replyQuote b{display:block;margin-bottom:2px}
.composerEmoji{flex:0 0 44px;border:0;border-radius:14px;background:var(--bg);color:var(--text);font-size:23px;cursor:pointer;padding:8px}.composer input{flex:1;min-width:0;border:0;border-radius:20px;background:var(--bg);color:var(--text);padding:13px}
.composer button,.primary{border:0;background:var(--accent);color:white;border-radius:14px;padding:12px 17px}
.composer .composerEmoji{flex:0 0 44px;border:0;border-radius:14px;background:var(--bg);color:var(--text);font-size:23px;cursor:pointer;padding:8px}
.notice{padding:18px;color:var(--muted);text-align:center}
#status{padding:8px 18px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:18px}
.dialog{width:100%;max-width:390px;background:var(--card);color:var(--text);border-radius:18px;padding:20px}
.dialog h3{margin:0 0 12px}
.dialog p{color:var(--muted);font-size:14px;line-height:1.5;white-space:pre-wrap}
.dialog input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);margin:8px 0 14px}
.dialogActions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.dialogActions button{border:0;border-radius:11px;padding:11px 14px;background:var(--bg);color:var(--text)}
.dialogActions .primary{background:var(--accent);color:white}
.actionSheet{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.actionSheet button{width:100%;text-align:left;border:0;border-radius:12px;padding:13px 14px;background:var(--bg);color:var(--text);cursor:pointer}
.actionSheet button.danger{color:var(--danger)}
.actionSheet button:active{transform:scale(.99)}
.actionSheet .cancelAction{text-align:center;color:var(--muted);margin-top:4px}
#settingsPanel{display:none;padding:18px 18px 90px}
.settingRow{background:var(--card);padding:15px;border-bottom:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
.errorText{color:var(--danger);font-size:12px;padding:5px 18px;overflow-wrap:anywhere}
/* Remove React and Options buttons below messages */
.bubbleActions,
.bubble-actions,
.messageActions,
.message-actions {
    display: none !important;
}

/* Hide old React and Options buttons */
.bubble button,
.bubbleActions button {
    display: none !important;
}

#reactionDetailsOverlay{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:center;justify-content:center;padding:16px}
#reactionDetailsPanel{width:100%;max-width:390px;max-height:75vh;overflow:auto;background:var(--card);color:var(--text);border-radius:18px;box-shadow:0 8px 30px #0003}
.reactionDetailsHead{display:flex;justify-content:space-between;align-items:center;padding:16px;font-weight:bold;border-bottom:1px solid var(--line)}
.reactionDetailsClose{border:0;background:var(--bg);color:var(--text);border-radius:9px;padding:6px 11px;font-size:20px}
.reactionTabs{display:flex;gap:7px;padding:12px;overflow-x:auto;border-bottom:1px solid var(--line)}
.reactionTab{border:1px solid var(--line);border-radius:20px;padding:6px 12px;background:var(--bg);color:var(--text);white-space:nowrap}
.reactionTab.active{background:#d9f7d9;border-color:#9ac99a}
.reactionPeople{padding:4px 14px 14px}
.reactionPerson{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.reactionAvatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:bold;flex-shrink:0}
.reactionPersonText{flex:1;min-width:0}.reactionPersonText small{display:block;color:var(--muted);margin-top:4px}
.reactionPersonEmoji{font-size:22px}
</style>
</head>
<body>
<header id="homeHeader">
<div class="logo">M<span>itra.</span></div>
<div class="actions">
<button onclick="toggleTheme()">◐</button>
<button onclick="showSettings()">⚙</button>
</div>
</header>

<div id="homeScreen">
<div class="search">
<input id="search" placeholder="⌕ Search chats or enter secret code..." oninput="filterChats()" onkeydown="searchEnter(event)">
</div>
<div class="tabs">
<span class="active">CHATS</span><span>GROUPS</span><span>CALLS</span>
</div>
<div class="section" id="listTitle">Recent Chats</div>
<div id="status">Starting Mitra...</div>
<div id="errorInfo" class="errorText"></div>
<main id="chats"><div class="notice">Loading chats...</div></main>
<button class="newchat" onclick="newChat()">＋</button>
</div>

<div id="settingsPanel">
<h2>Settings</h2>
<div class="settingRow">
<b id="profileName">Profile</b>
<p id="profileEmail" class="message"></p>
<p id="profileMobile" class="message"></p>
</div>
<div class="settingRow" onclick="changeProfile()">✏️ Edit Profile</div>
<div class="settingRow" onclick="toggleTheme()">◐ Change Theme</div>
<div class="settingRow" onclick="changePin()">🔐 Change Secret Code</div>
<div class="settingRow" onclick="resetPin()">♻️ Reset Secret Code</div>
<div class="settingRow" onclick="showNormalChats()">💬 Show Normal Chats</div>
<div class="settingRow" onclick="logout()" style="color:var(--danger)">↪ Logout</div>
<button class="primary" onclick="closeSettings()">Back to Chats</button>
</div>

<div id="chatScreen">
<div class="chatHeader">
<button onclick="backHome()">‹</button>
<div class="avatar" id="chatAvatar">M</div>
<div class="details">
<div class="name" id="chatName">Chat</div>
<div class="message" id="chatPresence">Mitra Messenger</div>
</div>
<button onclick="chatOptions()">⋮</button>
</div>
<div id="messages"><div class="notice">Loading messages...</div></div>
<div class="composer" id="composer">
<div id="replyPreview" class="replyPreview" style="display:none">
  <div class="replyPreviewText"><b id="replyPreviewName">Replying</b><span id="replyPreviewMessage"></span></div>
  <button type="button" class="replyCancel" onclick="cancelReply()" aria-label="Cancel reply">×</button>
</div>
<button type="button" class="composerEmoji" onclick="openComposerEmojiPicker()" title="Emoji">☺</button>
<input id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
<button type="button" onclick="sendMessage()">➤</button>
</div>
</div>

<nav class="bottom" id="bottomNav">
<div class="selected" onclick="backHome()"><b>▣</b>Chats</div>
<div><b>◉</b>Updates</div>
<div><b>☎</b>Calls</div>
<div onclick="showSettings()"><b>●</b>Profile</div>
</nav>

<div class="overlay" id="overlay">
<div class="dialog">
<h3 id="dialogTitle">Mitra</h3>
<p id="dialogText"></p>
<input id="dialogInput" style="display:none">
<div class="dialogActions" id="dialogActions">
<button onclick="closeDialog(false)">Cancel</button>
<button class="primary" onclick="closeDialog(true)">OK</button>
</div>
</div>
</div>

<div id="reactionDetailsOverlay" onclick="if(event.target===this)closeReactionDetails()">
  <div id="reactionDetailsPanel">
    <div class="reactionDetailsHead"><span id="reactionDetailsTitle">Reactions</span><button class="reactionDetailsClose" onclick="closeReactionDetails()" aria-label="Close">×</button></div>
    <div id="reactionTabs" class="reactionTabs"></div>
    <div id="reactionPeople" class="reactionPeople"></div>
  </div>
</div>

<script type="module">
import {auth,db,rtdb} from './firebase.js';
import {onAuthStateChanged,signOut,updatePassword} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,query,where,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
import { startPresence, stopPresence } from "./presence.js";
    import {
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
    
let currentUser=null;
let currentProfile=null;
let allChats=[];
let activeChat=null;
let chatsUnsubscribe=null;
let messagesUnsubscribe=null;
let showingHidden=false;
let dialogResolve=null;
    let presenceListeners = new Map();
let presenceCache = {};
let reactionListeners = new Map();
let currentReply = null;

function attachLongPress(element,callback){
  let timer=null,startX=0,startY=0,fired=false;
  const stop=()=>{if(timer!==null)clearTimeout(timer);timer=null;};
  element.style.touchAction="pan-y";
  element.style.webkitTouchCallout="none";
  element.style.userSelect="none";
  element.style.webkitUserSelect="none";

  element.addEventListener("pointerdown",event=>{
    if(event.pointerType==="mouse"&&event.button!==0)return;
    stop();fired=false;startX=event.clientX;startY=event.clientY;
    timer=setTimeout(()=>{
      timer=null;fired=true;
      element.dataset.longPressed="true";
      callback();
    },650);
  });
  element.addEventListener("pointermove",event=>{
    if(Math.abs(event.clientX-startX)>12||Math.abs(event.clientY-startY)>12)stop();
  });
  element.addEventListener("pointerup",stop);
  element.addEventListener("pointercancel",stop);
  element.addEventListener("contextmenu",event=>{
    event.preventDefault();
    if(!fired){
      stop();fired=true;
      element.dataset.longPressed="true";
      callback();
    }
  });
  element.addEventListener("click",event=>{
    if(element.dataset.longPressed==="true"){
      event.preventDefault();event.stopPropagation();
      delete element.dataset.longPressed;
    }
  },true);
}

let settings={secretSalt:"",secretHash:"",hiddenChatIds:[],deletedChatIds:[]};
const $=id=>document.getElementById(id);
function status(t){$("status").textContent=t;}
function showError(e){
  const message=e?.message||String(e);
  $("errorInfo").textContent=message;
  console.error("MITRA ERROR:",e);
}
function escapeHTML(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function ask(title,text,input=false,value=""){
  return new Promise(resolve=>{
    dialogResolve=resolve;
    $("dialogTitle").textContent=title;
    $("dialogText").textContent=text;
    $("dialogInput").style.display=input?"block":"none";
      $("dialogActions").innerHTML='<button onclick="closeDialog(false)">Cancel</button><button class="primary" onclick="closeDialog(true)">OK</button>';
$("dialogActions").style.display="flex";
    $("dialogInput").value=value;
    $("overlay").style.display="flex";
    setTimeout(()=>input&&$("dialogInput").focus(),100);
  });
}
window.closeDialog=ok=>{
  const inputVisible=$("dialogInput").style.display!=="none";
  const value=$("dialogInput").value;
  $("overlay").style.display="none";
  if(dialogResolve){dialogResolve(ok?(inputVisible?value:true):null);dialogResolve=null;}
};
async function confirmBox(text){return (await ask("Mitra",text))===true;}


function showActionSheet(title,actions){
  return new Promise(resolve=>{
    const overlay=$("overlay");
    $("dialogTitle").textContent=title;
    $("dialogText").textContent="";
    $("dialogInput").style.display="none";

    const old=$("dialogActions");

    // Keep original Cancel and OK buttons intact
    old.style.display="none";

    let sheet=document.getElementById("actionSheet");

    if(!sheet){
      sheet=document.createElement("div");
      sheet.id="actionSheet";
      sheet.className="actionSheet";
      old.parentNode.insertBefore(sheet,old);
    }

    sheet.innerHTML="";

    actions.forEach(action=>{
      const button=document.createElement("button");
      button.type="button";
      button.textContent=action.label;

      if(action.danger){
        button.classList.add("danger");
      }

      button.onclick=()=>{
        overlay.style.display="none";
        sheet.innerHTML="";
        old.style.display="flex";
        resolve(action.value);
      };

      sheet.appendChild(button);
    });

    const cancel=document.createElement("button");
    cancel.type="button";
    cancel.className="cancelAction";
    cancel.textContent="Cancel";

    cancel.onclick=()=>{
      overlay.style.display="none";
      sheet.innerHTML="";
      old.style.display="flex";
      resolve(null);
    };

    sheet.appendChild(cancel);
    overlay.style.display="flex";
  });
}
window.toggleTheme=()=>{
  document.body.classList.toggle("dark");
  localStorage.setItem("mitraTheme",document.body.classList.contains("dark")?"dark":"light");
};
if(localStorage.getItem("mitraTheme")==="dark")document.body.classList.add("dark");

window.addEventListener("error",e=>showError(e.message));
window.addEventListener("unhandledrejection",e=>showError(e.reason));

status("Connecting to Firebase...");
onAuthStateChanged(auth,async user=>{
  try{
    if(chatsUnsubscribe)chatsUnsubscribe();
    if(messagesUnsubscribe)messagesUnsubscribe();
    if(!user){
      currentUser=null;status("Please login first.");
      $("chats").innerHTML='<div class="notice">Please <a href="login.html">login</a> to use Mitra.</div>';
      return;
    }
    currentUser=user;
startPresence(user.uid);
status("Loading your profile...");
$("errorInfo").textContent="";
    const profileSnap=await getDoc(doc(db,"users",user.uid));
    if(!profileSnap.exists()){status("Profile not found.");return;}
    currentProfile=profileSnap.data();
    $("profileName").textContent=currentProfile.name||"Mitra User";
    $("profileEmail").textContent=currentProfile.email||user.email;
    $("profileMobile").textContent=currentProfile.mobile||"";
    status("Loading settings...");
    const settingsRef=doc(db,"userSettings",user.uid);
    const settingsSnap=await getDoc(settingsRef);
    if(settingsSnap.exists()){
      const d=settingsSnap.data();
      settings={
        secretSalt:d.secretSalt||"",secretHash:d.secretHash||"",
        hiddenChatIds:Array.isArray(d.hiddenChatIds)?d.hiddenChatIds:[],
        deletedChatIds:Array.isArray(d.deletedChatIds)?d.deletedChatIds:[]
      };
    }else{await saveSettings();}
    listenChats();
  }catch(error){status("Firebase Error");showError(error);}
},error=>{status("Authentication Error");showError(error);});

function listenChats(){
  status("Loading chats...");
  const q=query(collection(db,"chats"),where("members","array-contains",currentUser.uid));
  chatsUnsubscribe=onSnapshot(q,snapshot=>{
    allChats=snapshot.docs.map(d=>({id:d.id,...d.data()}));
    renderChats();status("Connected to Mitra");$("errorInfo").textContent="";
  },error=>{status("Chat loading error");showError(error);});
}

function listenPresence(uid) {
  if (!uid || presenceListeners.has(uid)) return;

  const statusRef = ref(rtdb, "status/" + uid);

  const unsubscribe = onValue(statusRef, snapshot => {
    presenceCache[uid] = snapshot.val() || {
      state: "offline",
      lastChanged: null
    };

   renderChats();
updateChatPresence(uid);
  });

  presenceListeners.set(uid, unsubscribe);
}


function formatLastSeen(timestamp) {
  if (!timestamp) return "Last seen unavailable";

  const date = new Date(timestamp);

  if (isNaN(date.getTime())) {
    return "Last seen unavailable";
  }

  return "Last seen " + date.toLocaleString("en-IN", {
    day: "numeric",
    month: "short",
    hour: "2-digit",
    minute: "2-digit"
  });
}
function formatMessageTime(timestamp) {
  if (!timestamp) return "";

  const date = typeof timestamp.toDate === "function"
    ? timestamp.toDate()
    : new Date(timestamp);

  if (isNaN(date.getTime())) return "";

  return date.toLocaleTimeString("en-IN", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function getMessageDate(timestamp) {
  if (!timestamp) return null;
  const date = typeof timestamp.toDate === "function"
    ? timestamp.toDate()
    : new Date(timestamp);
  return isNaN(date.getTime()) ? null : date;
}

function formatMessageDate(timestamp) {
  const date = getMessageDate(timestamp);
  if (!date) return "Date unavailable";

  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);

  const sameDay = (a, b) =>
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate();

  if (sameDay(date, today)) return "Today";
  if (sameDay(date, yesterday)) return "Yesterday";

  return date.toLocaleDateString("en-IN", {
    day: "numeric",
    month: "long",
    year: date.getFullYear() === today.getFullYear() ? undefined : "numeric"
  });
}

function getMessageDayKey(timestamp) {
  const date = getMessageDate(timestamp);
  if (!date) return "unknown";
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");
}
function updateChatPresence(uid) {
  const el = $("chatPresence");

  if (!el || !activeChat || !currentUser) return;

  const otherId = activeChat.members?.find(
    id => id !== currentUser.uid
  );

  if (otherId !== uid) return;

  const presence = presenceCache[uid] || {};

  el.textContent = presence.state === "online"
    ? "🟢 Online"
    : formatLastSeen(presence.lastChanged);
}

function filterChats() {
  const searchInput = $("search");
  if (!searchInput) return;
  const searchText = searchInput.value.trim().toLowerCase();
  const chatRows = document.querySelectorAll("#chats .chat");
  chatRows.forEach(row => {
    const rowText = row.textContent.toLowerCase();
    row.style.display = rowText.includes(searchText) ? "flex" : "none";
  });
}
function renderChats(){
  const list=$("chats");
  const hidden=new Set(settings.hiddenChatIds);
  const deleted=new Set(settings.deletedChatIds);

  let visible=allChats.filter(c=>
    !deleted.has(c.id)&&
    (showingHidden?hidden.has(c.id):!hidden.has(c.id))
  );

  visible.sort((a,b)=>
    (b.lastMessageAt?.toMillis?.()||0)-
    (a.lastMessageAt?.toMillis?.()||0)
  );

  $("listTitle").textContent=showingHidden?"Hidden Chats":"Recent Chats";

    if(otherId) listenPresence(otherId);

    const presence=presenceCache[otherId]||{};
    const isOnline=presence.state==="online";

        <div class="presence">${escapeHTML(statusText)}</div>
      </div>
      <div class="time">${hidden.has(c.id)?"🔒":"⋮"}</div>

    row._longPressTriggered=false;

    row.onclick=()=>{
      if(row._longPressTriggered){
        row._longPressTriggered=false;
        return;
      }
      openChat(c,otherId,name);
    };

    list.appendChild(row);
  });

  filterChats();

// Open chat and load all messages without duplicates
let messageRenderVersion = 0;

function openChat(chat, otherId, name) {
  activeChat = chat;

  $("settingsPanel").style.display = "none";
  $("homeScreen").style.display = "none";
  $("homeHeader").style.display = "none";
  $("bottomNav").style.display = "none";
  $("chatScreen").style.display = "block";

  $("chatName").textContent = name || "Mitra User";
  $("chatAvatar").textContent = (name || "M").charAt(0).toUpperCase();
    listenPresence(otherId);
updateChatPresence(otherId);

  if (messagesUnsubscribe) {
    messagesUnsubscribe();
    messagesUnsubscribe = null;
  }
  reactionListeners.forEach(unsub => unsub());
  reactionListeners.clear();

  const box = $("messages");
  box.innerHTML = '<div class="notice">Loading all messages...</div>';
  delete box.dataset.loaded;

  const currentChatId = chat.id;
  const version = ++messageRenderVersion;

  const messagesQuery = query(
    collection(db, "chats", currentChatId, "messages")
  );

  messagesUnsubscribe = onSnapshot(
    messagesQuery,
    async snapshot => {
      const renderVersion = ++messageRenderVersion;

      try {
        const wasAtBottom =
          box.scrollHeight - box.scrollTop - box.clientHeight < 100;

        // Get every message from the snapshot.
        const messageTasks = snapshot.docs.map(async messageDoc => {
        const m = {
  id: messageDoc.id,
  ...messageDoc.data({
    serverTimestamps: "estimate"
  })
};

          const hiddenRef = doc(
            db,
            "chats",
            currentChatId,
            "messages",
            m.id,
            "deletedFor",
            currentUser.uid
          );

          const reactionRef = collection(
            db,
            "chats",
            currentChatId,
            "messages",
            m.id,
            "reactions"
          );

          const [hiddenSnap, reactionSnap] = await Promise.all([
            getDoc(hiddenRef),
            getDocs(reactionRef)
          ]);

          if (hiddenSnap.exists()) {
            return null;
          }

          const reactionCounts = {};

          reactionSnap.forEach(r => {
            const emoji = r.data().emoji;
            if (emoji) {
              reactionCounts[emoji] =
                (reactionCounts[emoji] || 0) + 1;
            }
          });

          const reactionHTML = Object.entries(reactionCounts)
            .map(([emoji, count]) => `<button type="button" class="reactionPill" title="View reactions">${escapeHTML(emoji)} ${count}</button>`)
            .join("");

          return {
            message: m,
            reactionHTML
          };
        });

        // Load all messages together.
        const results = await Promise.all(messageTasks);

        // Ignore an older request if a newer snapshot arrived.
        if (
          renderVersion !== messageRenderVersion ||
          !activeChat ||
          activeChat.id !== currentChatId
        ) {
          return;
        }

        const validMessages = results.filter(Boolean);

        // Sort oldest to newest. Pending timestamps stay at bottom.
        validMessages.sort((a, b) => {
          const timeA =
            a.message.createdAt?.toMillis?.() ?? Number.MAX_SAFE_INTEGER;

          const timeB =
            b.message.createdAt?.toMillis?.() ?? Number.MAX_SAFE_INTEGER;

          return timeA - timeB;
        });

        // Build a fresh list, with one date separator per calendar day.
        const fragment = document.createDocumentFragment();
        let previousDayKey = null;

        validMessages.forEach(item => {
          const m = item.message;
          const dayKey = getMessageDayKey(m.createdAt);

          if (dayKey !== previousDayKey) {
            const separator = document.createElement("div");
            separator.className = "dateSeparator";
            separator.textContent = formatMessageDate(m.createdAt);
            fragment.appendChild(separator);
            previousDayKey = dayKey;
          }
          const deleted = m.deletedForEveryone === true;

          const bubble = document.createElement("div");

          bubble.dataset.messageId = m.id;
          bubble.dataset.createdAt = String(
            m.createdAt?.toMillis?.() ?? Number.MAX_SAFE_INTEGER
          );

          bubble.className =
            "bubble " +
            (m.senderId === currentUser.uid ? "mine " : "") +
            (deleted ? "deleted" : "");

          const contentHTML = deleted
            ? "This message was deleted"
            : escapeHTML(m.text || "");
          const replyHTML = m.replyTo ? `<div class="replyQuote"><b>${escapeHTML(m.replyTo.senderName || "Message")}</b>${escapeHTML(m.replyTo.text || "Message")}</div>` : "";

          let receiptHTML = "";
          if (m.senderId === currentUser.uid) {
            if (m.seenAt) {
              receiptHTML = '<span class="messageTicks seen" title="Seen">✓✓</span>';
            } else if (m.deliveredAt) {
              receiptHTML = '<span class="messageTicks delivered" title="Delivered">✓✓</span>';
            } else {
              receiptHTML = '<span class="messageTicks sent" title="Sent">✓</span>';
            }
          }

          bubble.innerHTML = `
            ${replyHTML}
            <div>${contentHTML}</div>
            <small>
              ${formatMessageTime(m.createdAt)}
              ${m.edited ? " · edited" : ""}
              ${receiptHTML}
            </small>
            <div class="reactionLine">${item.reactionHTML || ""}</div>
          `;

          const reactionLineElement = bubble.querySelector(".reactionLine");
          reactionLineElement.addEventListener("click", event => {
            event.stopPropagation();
            showReactionDetails(m);
          });

          if (!deleted) {
            attachLongPress(bubble, () => messageMenu(m));
            let swipeStartX = 0, swipeStartY = 0;
            bubble.addEventListener("pointerdown", event => {
              swipeStartX = event.clientX; swipeStartY = event.clientY;
            }, {passive:true});
            bubble.addEventListener("pointerup", event => {
              const dx = event.clientX - swipeStartX;
              const dy = event.clientY - swipeStartY;
              if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.25) {
                event.preventDefault();
                event.stopPropagation();
                setReplyTarget(m);
              }
            });
          }

          const messageRow = document.createElement("div");
          const mine = m.senderId === currentUser.uid;
          messageRow.className = "messageRow " + (mine ? "mine" : "theirs");

          const quickButton = document.createElement("button");
          quickButton.type = "button";
          quickButton.className = "quickReact";
          quickButton.textContent = "☺";
          quickButton.title = "Add reaction";
          quickButton.setAttribute("aria-label", "Add reaction");
          quickButton.addEventListener("click", event => {
            event.stopPropagation();
            pickMessageReaction(m);
          });

          if (mine) {
            messageRow.appendChild(quickButton);
            messageRow.appendChild(bubble);
          } else {
            messageRow.appendChild(bubble);
            messageRow.appendChild(quickButton);
          }
          fragment.appendChild(messageRow);
        });

        // Replace the complete message list in one operation.
        box.replaceChildren(fragment);

        reactionListeners.forEach(unsub => unsub());
        reactionListeners.clear();
        validMessages.forEach(item => {
          const m = item.message;
          const reactionRef = collection(db, "chats", currentChatId, "messages", m.id, "reactions");
          const unsub = onSnapshot(reactionRef, reactionSnapshot => {
            const counts = {};
            reactionSnapshot.forEach(reactionDoc => {
              const emoji = reactionDoc.data().emoji;
              if (emoji) counts[emoji] = (counts[emoji] || 0) + 1;
            });
            const line = box.querySelector('[data-message-id="' + m.id + '"] .reactionLine');
            if (line) line.innerHTML = Object.entries(counts).map(([emoji,count]) =>
              `<button type="button" class="reactionPill" title="View reactions">${escapeHTML(emoji)} ${count}</button>`
            ).join("");
          }, error => console.warn("Mitra reaction listener:", error));
          reactionListeners.set(m.id, unsub);
        });

        // Update receipts in the background; never wait for these writes
        // before rendering messages.
        validMessages.forEach(item => {
          const m = item.message;
          if (m.senderId === currentUser.uid) return;

          const messageRef = doc(
            db, "chats", currentChatId, "messages", m.id
          );
          const receiptUpdate = {};

          if (!m.deliveredAt) {
            receiptUpdate.deliveredAt = serverTimestamp();
          }
          if (!m.seenAt) {
            receiptUpdate.seenAt = serverTimestamp();
            receiptUpdate.seenByUid = currentUser.uid;
          }

          if (Object.keys(receiptUpdate).length) {
            updateDoc(messageRef, receiptUpdate).catch(error => {
              console.warn("Mitra receipt update failed:", error);
            });
          }
        });

        if (validMessages.length === 0) {
          box.innerHTML = '<div class="notice">Say hello 👋</div>';
        }

        box.dataset.loaded = "true";

        // Scroll to bottom on first load or if user was already at bottom.
        if (!wasAtBottom && box.dataset.firstLoad === "true") {
          box.scrollTop = box.scrollHeight;
        } else if (!box.dataset.firstLoad) {
          box.scrollTop = box.scrollHeight;
          box.dataset.firstLoad = "true";
        } else if (wasAtBottom) {
          box.scrollTop = box.scrollHeight;
        }

      } catch (error) {
        if (renderVersion !== messageRenderVersion) return;

        showError(error);

        box.innerHTML =
          '<div class="notice">Could not load messages: ' +
          escapeHTML(error.message) +
          '</div>';
      }
    },
    error => {
      showError(error);

      box.innerHTML =
        '<div class="notice">Message error: ' +
        escapeHTML(error.message) +
        '</div>';
    }
  );
}

// Reply preview and swipe-to-reply
function setReplyTarget(message){
  if(!message || message.deletedForEveryone)return;
  const senderName = message.senderId === currentUser?.uid
    ? (currentProfile?.name || "You")
    : (activeChat?.memberNames?.[activeChat.members?.indexOf(message.senderId)] || "Mitra User");
  currentReply = {...message, senderName};
  $("replyPreviewName").textContent = "Replying to " + senderName;
  $("replyPreviewMessage").textContent = message.text || "Message";
  $("replyPreview").style.display = "flex";
  $("messageInput").focus();
}
window.cancelReply=()=>{
  currentReply=null;
  const preview=$("replyPreview");
  if(preview)preview.style.display="none";
};

// Send message
window.sendMessage=async()=>{
  const input=$("messageInput");
  const text=input.value.trim();
  if(!text||!activeChat||!currentUser)return;
  input.value="";
  try{
    const messageData = {
      senderId:currentUser.uid,
      text,
      createdAt:serverTimestamp(),
      type:"text"
    };
    if (currentReply) messageData.replyTo = {
      messageId: currentReply.id,
      text: currentReply.text || "This message",
      senderId: currentReply.senderId,
      senderName: currentReply.senderName || (currentReply.senderId === currentUser.uid ? (currentProfile?.name || "You") : (activeChat.memberNames?.[activeChat.members?.indexOf(currentReply.senderId)] || "Mitra User"))
    };
    await addDoc(collection(db,"chats",activeChat.id,"messages"),messageData);
    cancelReply();
    await updateDoc(doc(db,"chats",activeChat.id),{
      lastMessage:text,
      lastMessageAt:serverTimestamp()
    });
  }catch(error){
    input.value=text;
    showError(error);
    await ask("Message Error",error.message);
  }
};

async function renderReactionDetails() {
  const message = reactionDetailsMessage;
  if (!message || !activeChat) return;
  const reactionRef = collection(db, "chats", activeChat.id, "messages", message.id, "reactions");
  const snap = await getDocs(reactionRef);
  const entries = snap.docs.map(d => ({ uid: d.id, ...(d.data() || {}) })).filter(x => x.emoji);
  const counts = {};
  entries.forEach(x => counts[x.emoji] = (counts[x.emoji] || 0) + 1);
  $("reactionDetailsTitle").textContent = `${entries.length} reaction${entries.length === 1 ? "" : "s"}`;
  const tabs = $("reactionTabs");
  tabs.innerHTML = "";
  const addTab = (key, label, count) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "reactionTab" + (reactionDetailsFilter === key ? " active" : "");
    b.textContent = label + (count ? " " + count : "");
    b.onclick = () => { reactionDetailsFilter = key; renderReactionDetails(); };
    tabs.appendChild(b);
  };
  addTab("all", "All", entries.length);
  Object.entries(counts).forEach(([emoji,count]) => addTab(emoji, emoji, count));
  const people = $("reactionPeople");
  people.innerHTML = "";
  const visible = reactionDetailsFilter === "all" ? entries : entries.filter(x => x.emoji === reactionDetailsFilter);
  for (const item of visible) {
    let displayName = item.uid === currentUser?.uid ? "You" : "Mitra User";
    let avatarText = item.uid === currentUser?.uid ? (currentProfile?.name || "Y").charAt(0).toUpperCase() : "M";
    if (item.uid !== currentUser?.uid) {
      try {
        const userSnap = await getDoc(doc(db, "users", item.uid));
        if (userSnap.exists()) {
          const userData = userSnap.data();
          displayName = userData.name || displayName;
          avatarText = (userData.name || "M").charAt(0).toUpperCase();
        }
      } catch (_) {}
    }
    const row = document.createElement("div");
    row.className = "reactionPerson";
    const avatar = document.createElement("div"); avatar.className = "reactionAvatar"; avatar.textContent = avatarText;
    const textBox = document.createElement("div"); textBox.className = "reactionPersonText";
    const name = document.createElement("div"); name.textContent = displayName;
    const hint = document.createElement("small"); hint.textContent = item.uid === currentUser?.uid ? "Click to remove" : " ";
    textBox.append(name,hint);
    const emoji = document.createElement("div"); emoji.className = "reactionPersonEmoji"; emoji.textContent = item.emoji;
    row.append(avatar,textBox,emoji);
    if (item.uid === currentUser?.uid) {
      row.title = "Click to remove your reaction";
      row.onclick = async () => {
        try {
          await deleteDoc(doc(db, "chats", activeChat.id, "messages", message.id, "reactions", currentUser.uid));
          await renderReactionDetails();
        } catch (error) { showError(error); await ask("Remove Reaction Error", error.message); }
      };
    }
    people.appendChild(row);
  }
  const add = document.createElement("button");
  add.type = "button"; add.className = "reactionTab"; add.textContent = "+ Add reaction";
  add.onclick = async () => {
    const emoji = await chooseMitraEmoji();
    if (!emoji) return;
    try {
      const ownRef = doc(db, "chats", activeChat.id, "messages", message.id, "reactions", currentUser.uid);
      const old = await getDoc(ownRef);
      if (old.exists() && old.data().emoji === emoji) await deleteDoc(ownRef);
      else await setDoc(ownRef, { userId: currentUser.uid, emoji, updatedAt: serverTimestamp() });
      reactionDetailsFilter = "all";
      await renderReactionDetails();
    } catch (error) { showError(error); await ask("Reaction Error", error.message); }
  };
  tabs.appendChild(add);
}

async function messageMenu(message){
  if(!activeChat||message.deletedForEveryone)return;
  const mine=message.senderId===currentUser.uid;
  const actions=[
    {label:"↩️  Reply",value:"reply"},
    {label:"😀  React",value:"react"},
    ...(mine?[{label:"ℹ️  Info",value:"info"}]:[]),
    ...(mine&&message.type==="text"?[{label:"✏️  Edit message",value:"edit"}]:[]),
    {label:"📋  Copy",value:"copy"},
    {label:"↪️  Forward",value:"forward"},
    {label:"🗑️  Delete for me",value:"deleteMe",danger:true},
    ...(mine?[{label:"❌  Delete for everyone",value:"deleteEveryone",danger:true}]:[])
  ];

  const choice=await showActionSheet("Message options",actions);
  if(!choice)return;
  if(choice==="reply")return setReplyTarget(message);
  if(choice==="react")return pickMessageReaction(message);

  try{
    const ref=doc(db,"chats",activeChat.id,"messages",message.id);

    if(choice==="info"){
      const formatInfoTime = timestamp => {
        const date = getMessageDate(timestamp);
        return date
          ? date.toLocaleString("en-IN", {
              day:"numeric",
              month:"short",
              year:"numeric",
              hour:"2-digit",
              minute:"2-digit"
            })
          : "Not available";
      };

      const sentTime = formatInfoTime(message.createdAt);
      const deliveredTime = message.deliveredAt
        ? formatInfoTime(message.deliveredAt)
        : "Not delivered yet";
      const seenTime = message.seenAt
        ? formatInfoTime(message.seenAt)
        : "Not seen yet";

      await ask(
        "Message Info",
        "Sent: " + sentTime +
        "\\nDelivered: " + deliveredTime +
        "\\nSeen: " + seenTime
      );
      return;
    }

    if(choice==="copy"){
      const copyText=message.text||"";
      if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(copyText);
      else{
        const temp=document.createElement("textarea");
        temp.value=copyText;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
      }
      return;
    }

    if(choice==="edit"){
      const value=await ask("Edit message","Update your message",true,message.text||"");
      if(value!==null&&value.trim()){
        await updateDoc(ref,{text:value.trim(),edited:true,editedAt:serverTimestamp()});
      }
      return;
    }

    if(choice==="deleteMe")return deleteMessageForMe(message);

    if(choice==="deleteEveryone"){
      if(await confirmBox("Delete this message for everyone?")){
        await updateDoc(ref,{
          deletedForEveryone:true,
          text:"",
          mediaUrl:"",
          deletedAt:serverTimestamp()
        });
      }
      return;
    }

    if(choice==="forward"){
      const number=await ask("Forward message","Enter recipient's 10-digit mobile number",true);
      if(!number)return;
      const found=await findUserByMobile(number.trim());
      if(!found)return ask("User not found","This user is not registered on Mitra.");

      const recipient=found.data();
      const members=[currentUser.uid,recipient.uid].sort();
      const chatId=members.join("_");
      const memberNames=members.map(uid=>uid===currentUser.uid?currentProfile.name:recipient.name);

      await setDoc(doc(db,"chats",chatId),{
        members,memberNames,
        lastMessage:message.text||message.fileName||"Forwarded media",
        lastMessageAt:serverTimestamp()
      },{merge:true});

      const forwarded={...message};
      delete forwarded.id;
      delete forwarded.deliveredAt;
      delete forwarded.seenAt;
      delete forwarded.seenByUid;

      await addDoc(collection(db,"chats",chatId,"messages"),{
        ...forwarded,
        senderId:currentUser.uid,
        forwarded:true,
        createdAt:serverTimestamp()
      });

      await ask("Forwarded","Message forwarded successfully.");
    }

  }catch(error){
    showError(error);
    await ask("Action error",error.message);
  }
}

// Secret code hash
async function hashPin(pin,saltHex){
  const salt=new Uint8Array(saltHex.match(/.{2}/g).map(x=>parseInt(x,16)));

  const material=await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(pin),
    "PBKDF2",
    false,
    ["deriveBits"]
  );

  const bits=await crypto.subtle.deriveBits({
    name:"PBKDF2",
    salt,
    iterations:150000,
    hash:"SHA-256"
  },material,256);

  return Array.from(new Uint8Array(bits))
    .map(x=>x.toString(16).padStart(2,"0"))
    .join("");
}

async function saveNewPin(pin){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  settings.secretSalt=Array.from(salt)
    .map(x=>x.toString(16).padStart(2,"0"))
    .join("");
  settings.secretHash=await hashPin(pin,settings.secretSalt);
  await saveSettings();
}

    await stopPresence(currentUser.uid);
  }

  await signOut(auth);
  location.href = "login.html";

} catch (error) {
  await ask("Logout Error", error.message);
}
};

</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js")
      .then(()=>console.log("Mitra Service Worker Registered"))
      .catch(error=>console.error("SW Error:",error));
  });
}
</script>
